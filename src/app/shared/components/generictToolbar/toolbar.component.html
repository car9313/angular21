<p-toolbar #toolbarContainer [class.hidden]="!shouldShow()">
    <div class="flex items-center gap-2 flex-1">
        <ng-content select="[toolbar-start]"></ng-content>
        <span class="flex-1"></span>

        @if (config().showAddButton !== false) {
            @if (config().addLabel) {
                <!-- Labeled variant: unambiguous on wide toolbars (WCAG-friendly
                     visible text + accessible name on the inner <button>). -->
                <p-button
                    *appHasPermission="let ok; resource: resource(); actions: actions()"
                    [label]="config().addLabel"
                    icon="pi pi-plus"
                    severity="primary"

                    [ariaLabel]="config().addLabel"
                    (onClick)="handleNew()"
                ></p-button>
            } @else {
                <!-- Legacy icon-only variant for screens without addLabel. -->
                <p-button
                    *appHasPermission="let ok; resource: resource(); actions: actions()"
                    pTooltip="Adicionar"
                    tooltipPosition="top"
                    icon="pi pi-plus"
                    severity="primary"
                    rounded="true"
                    ariaLabel="Agregar nuevo"
                    class="p-button-rounded shadow-md hover:scale-105 transition-transform duration-200 mr-2"
                    (onClick)="handleNew()"
                ></p-button>
            }
        }

        @for (btn of extraButtons(); track btn.id) {
            @if (btn.visible !== false) {
                @if (btn.permission) {
                    <ng-container *appHasPermission="let ok; resource: btn.permission.resource; actions: btn.permission.actions">
                        <p-button
                            [label]="btn.label"
                            [icon]="btn.icon"
                            [pTooltip]="btn.tooltip"
                            tooltipPosition="top"
                            [rounded]="btn.rounded ?? true"
                            [outlined]="btn.outlined ?? true"
                            [disabled]="btn.disabled"
                            [attr.aria-label]="btn.ariaLabel || btn.label || btn.id"
                            (onClick)="handleAction(btn)"
                        ></p-button>
                    </ng-container>
                } @else {
                    <p-button
                        [label]="btn.label"
                        [icon]="btn.icon"
                        [pTooltip]="btn.tooltip"
                        tooltipPosition="top"
                        [rounded]="btn.rounded ?? true"
                        [outlined]="btn.outlined ?? true"
                        [disabled]="btn.disabled"
                        [attr.aria-label]="btn.ariaLabel || btn.label || btn.id"
                        (onClick)="handleAction(btn)"
                    ></p-button>
                }
            }
        }

        <ng-content select="[toolbar-end]"></ng-content>
    </div>
</p-toolbar>
