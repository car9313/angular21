@if (loading$ | async) {
    <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black bg-opacity-50 transition-opacity duration-300">
        <p-progressSpinner ariaLabel="loading" styleClass="w-16 h-16" strokeWidth="4" fill="var(--surface-ground)" animationDuration=".5s"> </p-progressSpinner>
    </div>
}
